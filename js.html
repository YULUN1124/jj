<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA 質感選物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fafafa;
            color: #333;
        }

        /* 1. 按鈕誇張點擊發光特效 */
        @keyframes button-flash {
            0% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.8); transform: scale(0.9); }
            50% { box-shadow: 0 0 25px 15px rgba(0, 0, 0, 0.2); transform: scale(0.95); }
            100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); transform: scale(1); }
        }
        .btn-clicked {
            animation: button-flash 0.5s ease-out;
        }

        /* 2. 購物車劇烈震動與發光特效 */
        @keyframes violent-shake {
            0%, 100% { transform: scale(1) rotate(0); filter: drop-shadow(0 0 0px rgba(234, 179, 8, 0)); }
            10% { transform: scale(1.6) rotate(-25deg); filter: drop-shadow(0 0 20px rgba(234, 179, 8, 0.8)); }
            20% { transform: scale(1.6) rotate(25deg); }
            30% { transform: scale(1.6) rotate(-25deg); }
            40% { transform: scale(1.6) rotate(25deg); }
            50% { transform: scale(1.6) rotate(-25deg); filter: drop-shadow(0 0 30px rgba(234, 179, 8, 1)); }
            60% { transform: scale(1.4) rotate(15deg); }
            70% { transform: scale(1.2) rotate(-10deg); }
            80% { transform: scale(1.1) rotate(5deg); }
            90% { transform: scale(1.05) rotate(-2deg); }
        }
        .cart-violent {
            animation: violent-shake 0.7s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 購物車數字強烈彈跳放大 */
        @keyframes badge-pop {
            0% { transform: scale(1); background-color: #000; }
            50% { transform: scale(3) translateY(-5px); background-color: #ef4444; }
            100% { transform: scale(1); background-color: #000; }
        }
        .badge-pop-anim {
            animation: badge-pop 0.6s ease-out;
        }

        /* 3. 超誇張飛行動畫：包含瘋狂旋轉、巨大化與發光殘影 */
        .flying-wrapper {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            /* X軸：使用較平緩的曲線，配合Y軸形成誇張的弧度 */
            transition: left 0.9s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .flying-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            /* Y軸：先上拋再急墜 */
            transition: top 0.9s cubic-bezier(0.6, -0.5, 0.9, 0.6);
            /* 組合動畫：瘋狂旋轉、放大縮小與發光 */
            animation: crazy-spin-scale 0.9s ease-in-out forwards;
        }

        @keyframes crazy-spin-scale {
            0% { 
                transform: scale(1) rotate(0deg); 
                filter: drop-shadow(0 0 0px rgba(0,0,0,0)); 
                opacity: 1; 
            }
            40% { 
                /* 瞬間巨大化並發出強烈黃光 */
                transform: scale(2.5) rotate(1080deg); 
                filter: drop-shadow(0 0 40px rgba(250, 204, 21, 1)); 
                opacity: 0.9;
                border-radius: 50%;
            }
            100% { 
                /* 急速縮小鑽入購物車 */
                transform: scale(0.02) rotate(2880deg); /* 總共轉8圈 */
                filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.5)); 
                opacity: 0; 
            }
        }

        /* 隱藏捲軸但保持可捲動 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="antialiased selection:bg-black selection:text-white flex flex-col min-h-screen">

    <header class="fixed top-0 left-0 w-full bg-white/90 backdrop-blur-md shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <span class="text-2xl font-bold tracking-widest text-gray-900">AURA<span class="text-gray-400">.</span></span>
                </div>
                
                <!-- 購物車圖示 -->
                <div class="relative cursor-pointer group" id="cart-container">
                    <div id="cart-icon" class="p-3 bg-gray-50 rounded-full transition-colors duration-200">
                        <svg class="w-7 h-7 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                    </div>
                    <!-- 購物車數量徽章 -->
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-black text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow-md transform scale-0 transition-transform duration-300 z-10">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-32 pb-20 flex-grow">
        <!-- 標題區 -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-16 text-center">
            <h1 class="text-4xl md:text-5xl font-light tracking-widest text-gray-900 mb-6">極簡純粹的日常</h1>
            <p class="text-gray-500 max-w-2xl mx-auto leading-relaxed text-sm md:text-base">
                探索我們精心挑選的高質感好物，為您的生活空間與個人風格，增添一抹內斂而優雅的品味。
            </p>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12" id="product-grid">
                <!-- 商品將由 JavaScript 動態生成 -->
            </div>
        </div>
    </main>

    <script>
        // 商品資料 (繁體中文)
        const products = [
            { id: 1, name: '陶瓷手沖咖啡濾杯', price: 'NT$ 1,350', category: '居家生活', image: 'https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80' },
            { id: 2, name: '亞麻編織休閒椅', price: 'NT$ 8,200', category: '家具', image: 'https://images.unsplash.com/photo-1598300042247-d088f8ab3a91?auto=format&fit=crop&w=600&q=80' },
            { id: 3, name: '霧黑極簡設計腕錶', price: 'NT$ 4,800', category: '配件', image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80' },
            { id: 4, name: '北歐風實木餐桌', price: 'NT$ 15,500', category: '家具', image: 'https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?auto=format&fit=crop&w=600&q=80' },
            { id: 5, name: '極簡幾何落地燈', price: 'NT$ 2,600', category: '燈飾', image: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=80' },
            { id: 6, name: '清水模質感盆栽', price: 'NT$ 850', category: '裝飾', image: 'https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=600&q=80' },
            { id: 7, name: '原色帆布托特包', price: 'NT$ 1,100', category: '配件', image: 'https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&w=600&q=80' },
            { id: 8, name: '環保玻璃隨行杯', price: 'NT$ 680', category: '生活小物', image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=600&q=80' }
        ];

        let cartCount = 0;

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            
            products.forEach(product => {
                const card = document.createElement('div');
                // 讓整個卡片成為彈性容器，確保按鈕能沉到底部
                card.className = 'group flex flex-col h-full'; 
                
                card.innerHTML = `
                    <div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden bg-gray-100 mb-5 shadow-sm group-hover:shadow-md transition-shadow">
                        <img src="${product.image}" alt="${product.name}" id="img-${product.id}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out">
                    </div>
                    
                    <div class="flex flex-col flex-grow">
                        <div class="flex justify-between items-start mb-5">
                            <div>
                                <p class="text-xs text-gray-400 mb-1.5 tracking-wider">${product.category}</p>
                                <h3 class="text-base font-medium text-gray-800">${product.name}</h3>
                            </div>
                            <p class="text-base font-medium text-gray-900">${product.price}</p>
                        </div>
                        
                        <!-- 按鈕獨立放置於下方 -->
                        <button onclick="addToCart(event, ${product.id})" class="mt-auto w-full bg-black text-white px-6 py-3.5 rounded-lg font-medium text-sm tracking-widest shadow-lg hover:bg-gray-800 transition-colors duration-300 relative select-none">
                            加入購物車
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(event, productId) {
            const button = event.currentTarget;
            const originalImg = document.getElementById(`img-${productId}`);
            const cartIcon = document.getElementById('cart-icon');
            const cartBadge = document.getElementById('cart-badge');

            // 1. 觸發按鈕誇張的下壓與發光特效
            button.classList.remove('btn-clicked');
            void button.offsetWidth; // 觸發重繪
            button.classList.add('btn-clicked');

            // 2. 取得原圖片與購物車圖示的位置資訊
            const imgRect = originalImg.getBoundingClientRect();
            const cartRect = cartIcon.getBoundingClientRect();

            // 3. 建立飛行動畫用的元素
            const flyingWrapper = document.createElement('div');
            flyingWrapper.className = 'flying-wrapper';
            
            const flyingImg = originalImg.cloneNode(true);
            flyingImg.className = 'flying-img';
            
            flyingWrapper.appendChild(flyingImg);
            
            // 設定初始位置 (完全覆蓋原圖)
            flyingWrapper.style.left = `${imgRect.left}px`;
            flyingWrapper.style.top = `${imgRect.top}px`;
            flyingWrapper.style.width = `${imgRect.width}px`;
            flyingWrapper.style.height = `${imgRect.height}px`;
            
            document.body.appendChild(flyingWrapper);

            // 4. 強制重繪以套用初始狀態
            flyingWrapper.getBoundingClientRect();

            // 5. 計算飛行終點 (購物車中心)
            const targetLeft = cartRect.left + (cartRect.width / 2) - (imgRect.width / 2);
            const targetTop = cartRect.top + (cartRect.height / 2) - (imgRect.height / 2);

            // 6. 觸發位置改變 (旋轉縮放等視覺交給 CSS 動畫)
            flyingWrapper.style.left = `${targetLeft}px`;
            flyingImg.style.top = `${targetTop - imgRect.top}px`; 

            // 7. 監聽轉場結束事件，完成購物車的劇烈視覺回饋
            flyingWrapper.addEventListener('transitionend', function handler(e) {
                // 確保 X 軸移動結束才觸發
                if (e.propertyName !== 'left') return;
                
                // 移除飛行元素
                flyingWrapper.remove();
                
                // 更新購物車數量
                cartCount++;
                cartBadge.textContent = cartCount;
                
                if (cartCount > 0) {
                    cartBadge.style.transform = 'scale(1)';
                }
                
                // 觸發購物車圖示劇烈震動
                cartIcon.classList.remove('cart-violent');
                void cartIcon.offsetWidth;
                cartIcon.classList.add('cart-violent');

                // 觸發徽章數字劇烈彈跳
                cartBadge.classList.remove('badge-pop-anim');
                void cartBadge.offsetWidth;
                cartBadge.classList.add('badge-pop-anim');
            });
        }

        window.onload = () => {
            renderProducts();
        };
    </script>
</body>
</html>
